name: Report a theme
description: Tell us about a theme that should not be in the gallery.
title: "Report: "
labels: ["report"]
body:
  - type: input
    id: theme
    attributes:
      label: Theme
      description: The theme's folder name. The gallery's Report link fills this in.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: What is wrong with it. If it uses something of yours, say what and where it comes from.
    validations:
      required: true
